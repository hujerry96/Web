name: Scheduled Article Publisher

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run scheduler
        run: node tools/scheduler.mjs

      - name: Commit and push if articles published
        run: |
          git config user.name 'scheduler[bot]'
          git config user.email 'scheduler[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No articles published today."
          else
            git commit -m 'chore: auto-publish scheduled articles'
            git push
          fi
